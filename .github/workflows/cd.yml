name: CD - Deploy to Docker Hub on main

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create backend .env file from secrets
        run: echo "APP_SECRET_NAME=${{ secrets.APP_SECRET_NAME }}" > ci-cd-pipeline/backend/.env

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ci-cd-pipeline/backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-testing-deploy:backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ci-cd-pipeline/frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-testing-deploy:frontend